[package]
name = "tm2020-fast-training"
version = "0.37.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[lib]
name = "tm2020_fast"
path = "environment.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
gearbox-engine = { path = "../../third_party/gearbox/packages/engine" }
gearbox-world = { path = "../../third_party/gearbox/packages/world" }
gearbox-gbx = { path = "../../third_party/gearbox/packages/gbx" }
gearbox-net = { path = "../../third_party/gearbox/packages/net" }
gearbox-run = { path = "../../third_party/gearbox/packages/run" }
gearbox-trace = { path = "../../third_party/gearbox/packages/trace" }
gearbox-packs = { path = "../../third_party/gearbox/packages/packs" }

[patch.crates-io]
lzokay-native = { path = "lzo" }

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "tm2020-fast-probe"
path = "probe.rs"

[[bin]]
name = "replay_audit"
path = "../gearbox-host/src/bin/replay_audit.rs"

[[bin]]
name = "tm2020-fast-dataset"
path = "dataset.rs"
